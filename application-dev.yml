spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/orderflow
    username: orderflow
    password: orderflow
  data:
    redis:
      host: localhost
      port: 6380

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false