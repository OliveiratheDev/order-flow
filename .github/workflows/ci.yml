name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar, testar e validar cobertura
        run: ./mvnw -B verify

      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-testes
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
