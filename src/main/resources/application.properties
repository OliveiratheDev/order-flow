spring.application.name=orderflow
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.cache.type=redis
spring.cache.redis.time-to-live=5m
spring.cache.redis.cache-null-values=false
spring.data.redis.repositories.enabled=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=${RABBITMQ_CONSUMER_MAX_RETRIES:2}
spring.rabbitmq.listener.simple.retry.initial-interval=${RABBITMQ_CONSUMER_RETRY_INITIAL_INTERVAL:1s}
spring.rabbitmq.listener.simple.retry.multiplier=${RABBITMQ_CONSUMER_RETRY_MULTIPLIER:2}
spring.rabbitmq.listener.simple.retry.max-interval=${RABBITMQ_CONSUMER_RETRY_MAX_INTERVAL:2s}
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_CONSUMER_CONCURRENCY:2}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_CONSUMER_MAX_CONCURRENCY:5}
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_CONSUMER_PREFETCH:10}

orderflow.messaging.rabbit.enabled=${RABBITMQ_ENABLED:false}
orderflow.messaging.rabbit.publisher-confirm-timeout=${RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT:5s}
management.health.rabbit.enabled=${RABBITMQ_ENABLED:false}

orderflow.notification.processed-event-retention=${NOTIFICATION_PROCESSED_EVENT_RETENTION:30d}
orderflow.notification.cleanup-cron=${NOTIFICATION_CLEANUP_CRON:0 0 3 * * *}

orderflow.idempotency.processing-ttl=30s
orderflow.idempotency.retention-ttl=24h

management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=orderflow
management.metrics.distribution.percentiles-histogram.http.server.requests=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

orderflow.security.jwt.issuer=orderflow
orderflow.security.jwt.expiration=15m
orderflow.security.jwt.secret=${JWT_SECRET}

orderflow.payment.asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
orderflow.payment.asaas.api-key=${ASAAS_API_KEY:}
orderflow.payment.asaas.user-agent=${ASAAS_USER_AGENT:OrderFlow/1.0}
orderflow.payment.asaas.payment-due-days=${ASAAS_PAYMENT_DUE_DAYS:3}
orderflow.payment.asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
orderflow.payment.asaas.connect-timeout=${ASAAS_CONNECT_TIMEOUT:3s}
orderflow.payment.asaas.read-timeout=${ASAAS_READ_TIMEOUT:3s}

orderflow.payment.reconciliation.cron=${PAYMENT_RECONCILIATION_CRON:0 */15 * * * *}
orderflow.payment.reconciliation.min-age=${PAYMENT_RECONCILIATION_MIN_AGE:10m}
orderflow.payment.reconciliation.max-age=${PAYMENT_RECONCILIATION_MAX_AGE:7d}
orderflow.payment.reconciliation.batch-size=${PAYMENT_RECONCILIATION_BATCH_SIZE:200}
orderflow.payment.reconciliation.lock-at-most-for=${PAYMENT_RECONCILIATION_LOCK_AT_MOST:15m}
orderflow.payment.reconciliation.lock-at-least-for=${PAYMENT_RECONCILIATION_LOCK_AT_LEAST:1m}

resilience4j.circuitbreaker.instances.asaasPaymentCreate.sliding-window-size=20
resilience4j.circuitbreaker.instances.asaasPaymentCreate.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.asaasPaymentCreate.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.asaasPaymentCreate.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.asaasPaymentCreate.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.asaasPaymentCreate.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.asaasPaymentCreate.event-consumer-buffer-size=100
resilience4j.circuitbreaker.instances.asaasPaymentCreate.record-exceptions=com.start.overflow.payment.domain.PaymentGatewayUnavailableException

resilience4j.circuitbreaker.instances.asaasPaymentQuery.sliding-window-size=20
resilience4j.circuitbreaker.instances.asaasPaymentQuery.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.asaasPaymentQuery.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.asaasPaymentQuery.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.asaasPaymentQuery.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.asaasPaymentQuery.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.asaasPaymentQuery.event-consumer-buffer-size=100
resilience4j.circuitbreaker.instances.asaasPaymentQuery.record-exceptions=com.start.overflow.payment.domain.PaymentGatewayUnavailableException

resilience4j.circuitbreaker.instances.asaasPaymentCancel.sliding-window-size=20
resilience4j.circuitbreaker.instances.asaasPaymentCancel.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.asaasPaymentCancel.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.asaasPaymentCancel.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.asaasPaymentCancel.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.asaasPaymentCancel.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.asaasPaymentCancel.event-consumer-buffer-size=100
resilience4j.circuitbreaker.instances.asaasPaymentCancel.record-exceptions=com.start.overflow.payment.domain.PaymentGatewayUnavailableException

resilience4j.retry.instances.asaasPaymentQuery.max-attempts=3
resilience4j.retry.instances.asaasPaymentQuery.wait-duration=500ms
resilience4j.retry.instances.asaasPaymentQuery.enable-exponential-backoff=true
resilience4j.retry.instances.asaasPaymentQuery.exponential-backoff-multiplier=2
resilience4j.retry.instances.asaasPaymentQuery.retry-exceptions=com.start.overflow.payment.domain.PaymentGatewayUnavailableException
resilience4j.retry.instances.asaasPaymentQuery.event-consumer-buffer-size=100

resilience4j.timelimiter.instances.asaasPaymentCreate.timeout-duration=3s
resilience4j.timelimiter.instances.asaasPaymentCreate.cancel-running-future=true
resilience4j.timelimiter.instances.asaasPaymentQuery.timeout-duration=3s
resilience4j.timelimiter.instances.asaasPaymentQuery.cancel-running-future=true
resilience4j.timelimiter.instances.asaasPaymentCancel.timeout-duration=3s
resilience4j.timelimiter.instances.asaasPaymentCancel.cancel-running-future=true
