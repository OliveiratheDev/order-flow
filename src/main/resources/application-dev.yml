spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/orderflow
    username: orderflow
    password: orderflow
  data:
    redis:
      host: localhost
      port: 6380
  rabbitmq:
    host: localhost
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:orderflow}
    password: ${RABBITMQ_PASSWORD:orderflow}

orderflow:
  messaging:
    rabbit:
      enabled: ${RABBITMQ_ENABLED:true}

  bootstrap:
    admin:
      enabled: true
      name: Local Administrator
      email: admin@orderflow.local
      password: ${BOOTSTRAP_ADMIN_PASSWORD}

logging:
  level:
    com.start.overflow: INFO

management:
  health:
    rabbit:
      enabled: ${RABBITMQ_ENABLED:true}
