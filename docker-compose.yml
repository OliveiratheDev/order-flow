services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-orderflow}
      POSTGRES_USER: ${DB_USER:-orderflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orderflow}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orderflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-orderflow}
    ports:
      - "${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-orderflow}
      DB_USER: ${DB_USER:-orderflow}
      DB_PASSWORD: ${DB_PASSWORD:-orderflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-orderflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-orderflow}
      RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT: ${RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT:-5s}
      RABBITMQ_CONSUMER_MAX_RETRIES: ${RABBITMQ_CONSUMER_MAX_RETRIES:-2}
      RABBITMQ_CONSUMER_RETRY_INITIAL_INTERVAL: ${RABBITMQ_CONSUMER_RETRY_INITIAL_INTERVAL:-1s}
      RABBITMQ_CONSUMER_RETRY_MULTIPLIER: ${RABBITMQ_CONSUMER_RETRY_MULTIPLIER:-2}
      RABBITMQ_CONSUMER_RETRY_MAX_INTERVAL: ${RABBITMQ_CONSUMER_RETRY_MAX_INTERVAL:-2s}
      RABBITMQ_CONSUMER_CONCURRENCY: ${RABBITMQ_CONSUMER_CONCURRENCY:-2}
      RABBITMQ_CONSUMER_MAX_CONCURRENCY: ${RABBITMQ_CONSUMER_MAX_CONCURRENCY:-5}
      RABBITMQ_CONSUMER_PREFETCH: ${RABBITMQ_CONSUMER_PREFETCH:-10}
      NOTIFICATION_PROCESSED_EVENT_RETENTION: ${NOTIFICATION_PROCESSED_EVENT_RETENTION:-30d}
      NOTIFICATION_CLEANUP_CRON: ${NOTIFICATION_CLEANUP_CRON:-0 0 3 * * *}
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-change-before-production}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Local Administrator}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@orderflow.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-LocalAdmin123!}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_USER_AGENT: ${ASAAS_USER_AGENT:-OrderFlow/1.0}
      ASAAS_PAYMENT_DUE_DAYS: ${ASAAS_PAYMENT_DUE_DAYS:-3}
      ASAAS_CONNECT_TIMEOUT: ${ASAAS_CONNECT_TIMEOUT:-3s}
      ASAAS_READ_TIMEOUT: ${ASAAS_READ_TIMEOUT:-3s}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      PAYMENT_RECONCILIATION_CRON: ${PAYMENT_RECONCILIATION_CRON:-0 */15 * * * *}
      PAYMENT_RECONCILIATION_MIN_AGE: ${PAYMENT_RECONCILIATION_MIN_AGE:-10m}
      PAYMENT_RECONCILIATION_MAX_AGE: ${PAYMENT_RECONCILIATION_MAX_AGE:-7d}
      PAYMENT_RECONCILIATION_BATCH_SIZE: ${PAYMENT_RECONCILIATION_BATCH_SIZE:-200}
      PAYMENT_RECONCILIATION_LOCK_AT_MOST: ${PAYMENT_RECONCILIATION_LOCK_AT_MOST:-15m}
      PAYMENT_RECONCILIATION_LOCK_AT_LEAST: ${PAYMENT_RECONCILIATION_LOCK_AT_LEAST:-1m}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
